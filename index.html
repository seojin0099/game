<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손으로 자르는 과일 게임</title>
<style>
  :root {
    --bg: #0f1a14;
    --panel: rgba(12, 20, 16, 0.86);
    --ink: #f3f7ef;
    --muted: #a9bba8;
    --lime: #b8f13c;
    --red: #ff5a4d;
    --line: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
    opacity: 0.55; background: #000; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 0; pointer-events: none; font-weight: 800; }
  .hud .score { font-size: clamp(34px, 7vw, 60px); line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .hud .best { font-size: 16px; color: var(--muted); text-align: right; padding-top: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  #badge { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 18px; border: 2px solid var(--line);
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px); transition: background .12s, border-color .12s, color .12s;
    white-space: nowrap; pointer-events: none; }
  #badge.open { background: rgba(184,241,60,.2); border-color: var(--lime); color: var(--lime); }
  #badge.fist { background: rgba(255,90,77,.2); border-color: var(--red); color: var(--red); }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(8, 14, 11, .72); }
  #overlay.hidden { display: none; }
  .panel { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px 26px; max-height: 100%; overflow: auto; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 18px; color: var(--muted); line-height: 1.55; }
  .rules { display: grid; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
  .rules li { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .rules .ico { font-size: 26px; width: 34px; text-align: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 12px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0,0,0,.35); color: var(--ink); font-size: 14px; margin-bottom: 16px; }
  input[type=text]:focus-visible, button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; padding: 14px 20px;
    border-radius: 12px; font-size: 16px; }
  button.primary { background: var(--lime); color: #11200a; flex: 1 1 200px; }
  button.ghost { background: rgba(255,255,255,.1); color: var(--ink); flex: 1 1 140px; }
  button:disabled { opacity: .55; cursor: progress; }
  #status { min-height: 22px; margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  #status.err { color: #ff9d94; }
  .final { font-size: 15px; color: var(--muted); margin: 0 0 16px; }
  .final b { color: var(--lime); font-size: 36px; display: block; line-height: 1.1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="score" id="score">0</div>
    <div class="best">최고 기록 <span id="best">0</span></div>
  </div>
  <div id="badge">손을 보여주세요</div>

  <div id="overlay">
    <div class="panel">
      <div id="startView">
        <h1>손으로 자르는 과일 게임</h1>
        <p class="sub">카메라 앞에서 손을 휘둘러 과일을 자르세요. 폭탄을 자르면 끝납니다.</p>
        <ul class="rules">
          <li><span class="ico">✋</span><span>손바닥을 펼치면 과일과 폭탄을 자를 수 있어요</span></li>
          <li><span class="ico">✊</span><span>주먹을 쥐면 아무것도 자를 수 없어요</span></li>
          <li><span class="ico">💣</span><span>폭탄을 자르면 게임 종료</span></li>
        </ul>
        <label for="modelUrl">Teachable Machine 모델 주소</label>
        <input id="modelUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false"
               placeholder="https://teachablemachine.withgoogle.com/models/XXXXXXXX/">
        <div class="row">
          <button class="primary" id="startCam">카메라로 시작</button>
          <button class="ghost" id="startMouse">마우스로 연습</button>
        </div>
        <p id="status" role="status"></p>
      </div>
      <div id="overView" hidden>
        <h1>게임 종료</h1>
        <p class="final">이번 점수<b id="finalScore">0</b></p>
        <div class="row">
          <button class="primary" id="again">다시 하기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
(() => {
  'use strict';

  /* ===================== 설정 (여기만 고치세요) ===================== */
  // 모델 주소를 코드에 고정하려면 아래에 넣으세요. 비워두면 화면의 입력칸 값을 씁니다.
  // 예: "https://teachablemachine.withgoogle.com/models/abcd1234/"
  const DEFAULT_MODEL_URL = "";

  // 클래스 이름 판별. 학습할 때 지은 이름에 아래 단어가 포함되어 있으면 인식합니다.
  // (대소문자 무시) 이름이 다르면 단어를 추가하세요.
  const OPEN_WORDS = ["손바닥", "펼", "보", "open", "palm", "paper", "hand"];
  const FIST_WORDS = ["주먹", "쥐", "fist", "close", "closed", "rock"];

  const CONFIDENCE = 0.7;        // 이 확률 이상일 때만 손 모양 변경
  const PREDICT_INTERVAL = 90;   // 손 모양 판별 주기(ms)
  /* ================================================================ */

  const $ = (id) => document.getElementById(id);
  const video = $('cam'), canvas = $('game'), ctx = canvas.getContext('2d');
  const badge = $('badge'), overlay = $('overlay');
  const startView = $('startView'), overView = $('overView');
  const statusEl = $('status'), modelInput = $('modelUrl');
  const scoreEl = $('score'), bestEl = $('best');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- 저장 (막혀 있어도 게임은 동작) ---------- */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('fruit-best') || '0', 10) || 0;
  bestEl.textContent = best;
  modelInput.value = DEFAULT_MODEL_URL || store.get('fruit-model-url') || '';

  /* ---------- 상태 ---------- */
  let mode = 'none';          // 'camera' | 'mouse'
  let model = null;           // Teachable Machine 모델
  let handOpen = true;        // 손바닥 펼침 여부 (true일 때만 자를 수 있음)
  let handSeen = false;
  let playing = false;
  let score = 0;
  let blade = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, has: false };
  let trail = [];
  let objects = [], halves = [], particles = [], flashes = [];
  let spawnTimer = 0, elapsed = 0, lastT = 0;
  let spaceHeld = false;

  /* ---------- 손 모양 표시 ---------- */
  function setBadge() {
    if (!playing && mode === 'none') return;
    if (mode === 'camera' && !handSeen && model) {
      badge.className = ''; badge.textContent = '손을 보여주세요'; return;
    }
    if (handOpen) { badge.className = 'open'; badge.textContent = '✋ 자르기 가능'; }
    else { badge.className = 'fist'; badge.textContent = '✊ 자르기 불가'; }
  }

  /* ---------- 카메라 ---------- */
  async function startCamera() {
    if (!window.isSecureContext) {
      throw new Error('보안 연결(https)에서만 카메라를 쓸 수 있어요. GitHub Pages 주소(https://...)로 열어 주세요.');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('이 브라우저는 카메라를 지원하지 않아요. 최신 Chrome, Safari, Edge를 써 주세요.');
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
      });
    } catch (e) {
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError')
        throw new Error('카메라 권한이 막혀 있어요. 주소창의 카메라 아이콘에서 허용으로 바꾼 뒤 새로고침해 주세요.');
      if (e.name === 'NotFoundError' || e.name === 'OverconstrainedError')
        throw new Error('카메라를 찾지 못했어요. 카메라가 연결되어 있는지 확인해 주세요.');
      if (e.name === 'NotReadableError' || e.name === 'AbortError')
        throw new Error('다른 프로그램(화상회의 등)이 카메라를 쓰고 있어요. 닫고 다시 시도해 주세요.');
      throw new Error('카메라를 시작하지 못했어요: ' + (e.message || e.name));
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    // 첫 프레임이 들어올 때까지 대기
    await new Promise((resolve, reject) => {
      const t0 = performance.now();
      (function wait() {
        if (video.readyState >= 2 && video.videoWidth > 0) return resolve();
        if (performance.now() - t0 > 8000) return reject(new Error('카메라 화면이 들어오지 않아요. 새로고침 후 다시 시도해 주세요.'));
        requestAnimationFrame(wait);
      })();
    });
  }

  /* ---------- 모델 ---------- */
  async function loadModel(url) {
    if (typeof tmImage === 'undefined') {
      throw new Error('모델 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    }
    let base = url.trim();
    if (!base.endsWith('/')) base += '/';
    try {
      model = await tmImage.load(base + 'model.json', base + 'metadata.json');
    } catch (e) {
      throw new Error('모델을 불러오지 못했어요. 주소를 다시 확인해 주세요. (공유 링크의 "https://teachablemachine.withgoogle.com/models/..." 형태)');
    }
  }

  function labelKind(name) {
    const n = name.toLowerCase();
    if (FIST_WORDS.some(w => n.includes(w))) return 'fist';
    if (OPEN_WORDS.some(w => n.includes(w))) return 'open';
    return 'other';
  }

  let predicting = false, lastPredict = 0, streak = { kind: '', n: 0 };
  async function predictLoop(now) {
    if (mode !== 'camera' || !model) return;
    if (!predicting && now - lastPredict > PREDICT_INTERVAL && video.readyState >= 2) {
      predicting = true; lastPredict = now;
      try {
        const out = await model.predict(video, true);
        let top = out[0];
        for (const o of out) if (o.probability > top.probability) top = o;
        const kind = labelKind(top.className);
        if (top.probability >= CONFIDENCE && kind !== 'other') {
          streak = streak.kind === kind ? { kind, n: streak.n + 1 } : { kind, n: 1 };
          if (streak.n >= 2) {              // 2번 연속 같은 결과일 때만 반영 (깜빡임 방지)
            handSeen = true;
            handOpen = kind === 'open';
            setBadge();
          }
        } else if (kind === 'other' && top.probability >= CONFIDENCE) {
          // "아무것도 없음" 같은 클래스 → 손이 안 보이는 상태로 취급, 자르기 불가
          handSeen = false; handOpen = false; setBadge();
          badge.className = ''; badge.textContent = '손을 보여주세요';
        }
      } catch (e) { /* 한 프레임 실패는 무시 */ }
      predicting = false;
    }
  }

  /* ---------- 손 위치 추적 (움직임 중심) ---------- */
  const MW = 64, MH = 48;
  const mc = document.createElement('canvas'); mc.width = MW; mc.height = MH;
  const mctx = mc.getContext('2d', { willReadFrequently: true });
  let prevFrame = null, motionX = 0.5, motionY = 0.5;

  function videoToScreen(nx, ny) {
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    const s = Math.max(W / vw, H / vh);
    const xv = (1 - nx) * vw;                     // 거울 모드
    const yv = ny * vh;
    return { x: xv * s - (vw * s - W) / 2, y: yv * s - (vh * s - H) / 2 };
  }

  function trackMotion() {
    if (video.readyState < 2) return false;
    mctx.drawImage(video, 0, 0, MW, MH);
    const cur = mctx.getImageData(0, 0, MW, MH).data;
    if (!prevFrame) { prevFrame = new Uint8ClampedArray(cur); return false; }
    const rows = new Array(MH).fill(0);
    const hits = [];
    for (let y = 0; y < MH; y++) {
      for (let x = 0; x < MW; x++) {
        const i = (y * MW + x) * 4;
        const d = Math.abs(cur[i] - prevFrame[i]) + Math.abs(cur[i+1] - prevFrame[i+1]) + Math.abs(cur[i+2] - prevFrame[i+2]);
        if (d > 70) { hits.push(x, y); rows[y]++; }
      }
    }
    prevFrame.set(cur);
    if (hits.length < 12) return false;           // 움직임이 거의 없으면 위치 유지
    // 움직임 영역의 가장 위쪽(보통 올린 손)을 기준으로 잡는다
    let top = 0;
    while (top < MH && rows[top] < 2) top++;
    if (top >= MH) return false;
    let sx = 0, sy = 0, n = 0;
    for (let k = 0; k < hits.length; k += 2) {
      if (hits[k + 1] <= top + 16) { sx += hits[k]; sy += hits[k + 1]; n++; }
    }
    if (n < 6) return false;
    motionX += (sx / n / MW - motionX) * 0.6;
    motionY += (sy / n / MH - motionY) * 0.6;
    return true;
  }

  /* ---------- 마우스 / 터치 (연습 모드) ---------- */
  function pointerMove(e) {
    if (mode !== 'mouse') return;
    const t = e.touches ? e.touches[0] : e;
    if (!t) return;
    setBladeTarget(t.clientX, t.clientY);
  }
  canvas.addEventListener('mousemove', pointerMove);
  canvas.addEventListener('touchstart', pointerMove, { passive: true });
  canvas.addEventListener('touchmove', (e) => { pointerMove(e); e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && mode === 'mouse') { spaceHeld = true; handOpen = false; setBadge(); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && mode === 'mouse') { spaceHeld = false; handOpen = true; setBadge(); }
  });

  function setBladeTarget(x, y) {
    blade.px = blade.x; blade.py = blade.y;
    blade.x = x; blade.y = y;
    if (!blade.has) { blade.px = x; blade.py = y; blade.has = true; }
  }

  /* ---------- 과일 / 폭탄 ---------- */
  const FRUITS = [
    { e: '🍉', c: '#ff4d5e' }, { e: '🍊', c: '#ff9d1c' }, { e: '🍎', c: '#ff3b3b' },
    { e: '🍌', c: '#ffe14a' }, { e: '🍓', c: '#ff3d6e' }, { e: '🍍', c: '#ffd23f' },
    { e: '🍇', c: '#a35bff' }, { e: '🥝', c: '#9be23a' }, { e: '🍋', c: '#fff04a' }
  ];

  function spawn() {
    const R = Math.max(26, Math.min(W, H) * 0.07);
    const bombChance = Math.min(0.12 + elapsed * 0.003, 0.3);
    const isBomb = Math.random() < bombChance;
    const f = FRUITS[(Math.random() * FRUITS.length) | 0];
    const g = H * 1.15;
    const x = R + Math.random() * (W - R * 2);
    const peak = H * (0.55 + Math.random() * 0.3);
    const vy = -Math.sqrt(2 * g * peak);
    const vx = ((W / 2 - x) / W) * (W * 0.35) * (0.4 + Math.random() * 0.8);
    objects.push({
      x, y: H + R, vx, vy, g, r: R, bomb: isBomb,
      e: isBomb ? '💣' : f.e, c: isBomb ? '#ffffff' : f.c,
      rot: 0, vr: (Math.random() - 0.5) * 4
    });
  }

  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function sliceFruit(o, angle) {
    score++;
    scoreEl.textContent = score;
    for (let s = -1; s <= 1; s += 2) {
      halves.push({
        x: o.x, y: o.y, r: o.r, e: o.e, side: s, rot: o.rot,
        vx: o.vx + s * (80 + Math.random() * 60), vy: o.vy * 0.3 - 40,
        vr: s * (1 + Math.random() * 2), g: o.g, life: 1.4
      });
    }
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
      particles.push({ x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        r: 2 + Math.random() * 4, c: o.c, life: 0.6 + Math.random() * 0.4, max: 1 });
    }
  }

  function explode(o) {
    flashes.push({ x: o.x, y: o.y, t: 0 });
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, v = 200 + Math.random() * 500;
      particles.push({ x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        r: 3 + Math.random() * 6, c: Math.random() < 0.5 ? '#ffb02e' : '#ff5a4d', life: 0.7 + Math.random() * 0.5, max: 1 });
    }
    endGame();
  }

  /* ---------- 게임 흐름 ---------- */
  function startGame() {
    score = 0; scoreEl.textContent = '0';
    objects = []; halves = []; particles = []; flashes = []; trail = [];
    spawnTimer = 0.4; elapsed = 0;
    playing = true;
    overlay.classList.add('hidden');
    setBadge();
  }

  let endTimer = 0;
  function endGame() {
    playing = false;
    if (score > best) { best = score; store.set('fruit-best', String(best)); bestEl.textContent = best; }
    clearTimeout(endTimer);
    endTimer = setTimeout(() => {
      $('finalScore').textContent = score;
      startView.hidden = true; overView.hidden = false;
      overlay.classList.remove('hidden');
    }, 900);
  }

  /* ---------- 메인 루프 ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - lastT) / 1000 || 0.016, 0.05);
    lastT = now;

    if (mode === 'camera') {
      if (trackMotion()) { const p = videoToScreen(motionX, motionY); setBladeTarget(p.x, p.y); }
      predictLoop(now);
    }

    // 칼날 궤적
    if (blade.has) {
      trail.push({ x: blade.x, y: blade.y, t: now });
    }
    while (trail.length && now - trail[0].t > 220) trail.shift();

    if (playing) {
      elapsed += dt;
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        const n = 1 + (Math.random() < Math.min(0.15 + elapsed * 0.01, 0.6) ? 1 : 0) + (Math.random() < 0.1 ? 1 : 0);
        for (let i = 0; i < n; i++) spawn();
        spawnTimer = Math.max(0.55, 1.5 - elapsed * 0.012);
      }
    }

    // 물체 이동 / 충돌
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      o.vy += o.g * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
      if (o.y > H + o.r * 2 && o.vy > 0) { objects.splice(i, 1); continue; }
      if (playing && handOpen && blade.has) {
        const hit = distToSegment(o.x, o.y, blade.px, blade.py, blade.x, blade.y) <= o.r * 1.05;
        if (hit) {
          objects.splice(i, 1);
          if (o.bomb) { explode(o); break; }
          sliceFruit(o);
        }
      }
    }
    blade.px = blade.x; blade.py = blade.y;

    for (let i = halves.length - 1; i >= 0; i--) {
      const h = halves[i];
      h.vy += h.g * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vr * dt; h.life -= dt;
      if (h.life <= 0 || h.y > H + h.r * 2) halves.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t > 0.5) flashes.splice(i, 1); }

    draw(now);
  }

  /* ---------- 그리기 ---------- */
  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    for (const o of objects) {
      ctx.save();
      ctx.translate(o.x, o.y); ctx.rotate(o.rot);
      ctx.font = `${o.r * 2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(o.e, 0, 0);
      ctx.restore();
    }

    for (const h of halves) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, h.life));
      ctx.translate(h.x, h.y); ctx.rotate(h.rot);
      ctx.beginPath();
      if (h.side < 0) ctx.rect(-h.r * 1.5, -h.r * 1.5, h.r * 1.5, h.r * 3);
      else ctx.rect(0, -h.r * 1.5, h.r * 1.5, h.r * 3);
      ctx.clip();
      ctx.font = `${h.r * 2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(h.e, 0, 0);
      ctx.restore();
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6));
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const f of flashes) {
      const k = f.t / 0.5;
      ctx.fillStyle = `rgba(255,220,140,${0.85 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 30 + k * Math.max(W, H) * 0.5, 0, Math.PI * 2); ctx.fill();
    }

    // 칼날 궤적 (주먹이면 붉은 회색 — 자를 수 없음을 표시)
    if (trail.length > 1) {
      const col = handOpen ? '184,241,60' : '255,90,77';
      for (let i = 1; i < trail.length; i++) {
        const a = trail[i - 1], b = trail[i];
        const k = i / trail.length;
        ctx.strokeStyle = `rgba(${col},${k * (handOpen ? 0.95 : 0.4)})`;
        ctx.lineWidth = (handOpen ? 3 + k * 12 : 2 + k * 4);
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    if (blade.has && (mode === 'camera' || mode === 'mouse')) {
      ctx.strokeStyle = handOpen ? '#b8f13c' : '#ff5a4d';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(blade.x, blade.y, handOpen ? 16 : 11, 0, Math.PI * 2); ctx.stroke();
    }
  }

  /* ---------- 시작 버튼 ---------- */
  function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.className = isErr ? 'err' : ''; }

  $('startCam').addEventListener('click', async () => {
    const btns = [$('startCam'), $('startMouse')];
    btns.forEach(b => b.disabled = true);
    try {
      setStatus('카메라를 켜는 중… 권한 요청이 뜨면 "허용"을 눌러 주세요.');
      await startCamera();
      const url = (DEFAULT_MODEL_URL || modelInput.value).trim();
      if (url) {
        setStatus('손 모양 모델을 불러오는 중…');
        await loadModel(url);
        store.set('fruit-model-url', url);
        handSeen = false; handOpen = false;
      } else {
        model = null; handSeen = true; handOpen = true;
        setStatus('모델 주소가 비어 있어 손 모양 구분 없이 시작합니다.');
      }
      mode = 'camera';
      prevFrame = null;
      blade.has = false;
      setStatus('');
      startGame();
    } catch (e) {
      setStatus(e.message || String(e), true);
    }
    btns.forEach(b => b.disabled = false);
  });

  $('startMouse').addEventListener('click', () => {
    mode = 'mouse'; model = null; handSeen = true; handOpen = true; blade.has = false;
    video.style.opacity = 0;
    setStatus('');
    startGame();
  });

  $('again').addEventListener('click', () => {
    overView.hidden = true; startView.hidden = false;
    if (mode === 'camera' && model) { handOpen = false; handSeen = false; }
    else if (mode === 'mouse') handOpen = !spaceHeld;
    startGame();
  });

  requestAnimationFrame((t) => { lastT = t; frame(t); });
})();
</script>
</body>
</html>
